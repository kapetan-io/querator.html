<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGradient)"/>
  
  <!-- Queue elements (3 circles representing messages) -->
  <circle cx="8" cy="16" r="2.5" fill="#64748b" opacity="0.6"/>
  <circle cx="16" cy="16" r="2.5" fill="#94a3b8" opacity="0.8"/>
  <circle cx="24" cy="16" r="2.5" fill="url(#arrowGradient)"/>
  
  <!-- Arrow showing flow -->
  <path d="M26 14 L30 16 L26 18" stroke="url(#arrowGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>